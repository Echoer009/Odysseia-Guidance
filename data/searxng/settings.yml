# SearXNG 搜索引擎配置
# 文档: https://docs.searxng.org/admin/settings/settings.html

use_default_settings: true

search:
  formats:
    - html
    - json
  default_lang: ""
  safe_search: 0

server:
  secret_key: "odysseia_guidance_searxng_secret_change_me"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

hostnames:
  remove:
    - '(.*\.)?dzmm\.[a-z]+$'
    - '(.*\.)?aifengyue\.[a-z]+$'
    - '(.*\.)?fengyueai\.[a-z]+$'

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false
  - name: bing
    engine: bing
    shortcut: b
    # 2026-09-12: 孟买出口 IP 上 bing 持续返回无关结果(中文查询返回日本中古车页),
    # language=zh-CN 也无法修复,且排名靠前污染 top-5,已禁用
    disabled: true
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    # 2026-09-12: VPS 出口 IP 被 DDG 永久弹 CAPTCHA(72h 内 900 次)，已禁用
    disabled: true
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
  - name: github
    engine: github
    shortcut: gh
    disabled: false
  # 2026-09-12: startpage 同样对 VPS IP 弹验证码，显式禁用(默认配置里是启用的)
  - name: startpage
    engine: startpage
    shortcut: sp
    disabled: true
  - name: karmasearch
    disabled: true
  - name: brave
    disabled: true
